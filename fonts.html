<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indian Flag Gradient</title>

    <style>
        @font-face{
            font-family:"myfont";
            src:url("./fonts/myfont.ttf");
        }
        p {
            font-family:myfont;
            font-size: large;
            font-weight: bolder;
            font-stretch: expanded;
            text-align: center;
            letter-spacing: 2px;
            word-spacing: 3px;
            line-height: 2em;

            background:
                radial-gradient(
                    circle at center,
                    #001f8f 0%,
                    #0047ab 12%,
                    #168cff 20%,
                    transparent 28%
                ),
                linear-gradient(
                    to bottom,
                    #ff7b00 0%,
                    #ff9933 25%,
                    #ffb347 33%,

                    #ffffff 33%,
                    #f5f5f5 50%,
                    #ffffff 66%,

                    #138808 66%,
                    #21a317 80%,
                    #006400 100%
                );

            color: black;
            padding: 30px;
        }
    </style>

</head>

<body>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Debitis placeat qui necessitatibus neque et nesciunt nostrum
        corrupti quis, dolores nemo quod ratione hic repellendus sit
        provident consectetur iure veritatis exercitationem.
    </p>

</body>

</html>
