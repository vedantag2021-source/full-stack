<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUBGRID</title>
    <style>
        :root{
            --primary-color:green;
            --secondary-color:black;
            --tertiary-color:blue;
            --text-size:30px;
            --t--size:20px;
        }
        .container{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            grid-template-rows:1fr 1fr 1fr;
            outline:1px solid black;
            height:500px;
            width:500px;
            background-color:var(--tertiary-color);
        }
        .parent{
            display:grid;
            grid-template-columns:subgrid;
            grid-template-rows:subgrid;
            font-size:var(--text-size);
            grid-column:1/3;
            grid-row:1/3;
            background-color:var(--primary-color);
        }
        .child{
            background-color:var(--tertiary-color);
            grid-column:1/2;
            grid-row:1/2;
        }
        p{
            font-size:calc(var(--text-size)-var(--t--size));
            color:var(--secondary-color); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">1</div>
        </div>
    </div>
    <p>hello world!!</p>
</body>
</html>
