<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer special,base;
        @layer base{
            p{
                color:red;
            }
        }
        @layer special{
            p{
                color:blue;
            }
        }
        button{
            width:100px;
            height:100px;
            border:3px solid black;
            border-radius:50%;
            box-shadow:3px 3px grey;
            background-color:black;
            color:white;
        }
        button:active{
            box-shadow:inset 3px 3px grey;
            background-color:white;
            color:black;
        }
        :where(a.author){
            text-decoration:overline;
            color:red;
        }
        .card{
            margin:auto;

            width:200px;
            padding:3%;
            box-shadow:3px 3px 5px grey;

        }
        .card__text{
            font-family:Arial, Helvetica, sans-serif;
            font-weight:900;
        }
        .card__btn__submit{
            background-color:black;
            color:white;
            box-shadow:3px 3px 5px grey;
            width:100px;
            height:40px;
        }
    </style>
</head>
<body>
    <p>SPECIFICITY</p>
    <button>CLICK ME!!!</button>
    <p><a href="#" class="author">LINK</a></p>

    <div class="card">
        <img class="card__img" src="https://picsum.photos/id/237/200/300"/>
        <p class="card__text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
        <button class="card__btn__submit">SUBMIT</button>
    </div>
</body>
</html>
