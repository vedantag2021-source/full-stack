<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer special,base;
        @layer base{
            p{
                color:red;
            }
        }
        @layer special{
            p{
                color:blue;
            }
        }
        button{
            width:100px;
            height:100px;
            border:3px solid black;
            border-radius:50%;
            box-shadow:3px 3px grey;
            background-color:black;
            color:white;
        }
        button:active{
            box-shadow:inset 3px 3px grey;
            background-color:white;
            color:black;
        }
        :where(a.author){
            text-decoration:overline;
            color:red;
        }
    </style>
</head>
<body>
    <p>SPECIFICITY</p>
    <button>CLICK ME!!!</button>
    <p><a href="#">LINK</a></p>
</body>
</html>
