<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>task4</title>

    <style>
        .container {
            height: 90vh;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            grid-template-areas:
                "box1 box1 box1 box1"
                "box2 box3 box3 box3"
                "box2 box4 box4 box4"
                "box2 box3 box3 box4"
                "box2 box3 box3 box4"
                "box6 box6 box6 box6";

            gap: 5px;
        }


        .container > div {
            outline: 1px solid black;
            outline-style: auto;
        }


        .container > div:nth-child(1) {
            background-color: lightblue;
        }

        .container > div:nth-child(2) {
            background-color: lightgreen;
        }

        .container > div:nth-child(3) {
            background-color: lightcoral;
        }

        .container > div:nth-child(4) {
            background-color: lightpink;
        }

        .container > div:nth-child(5) {
            background-color: magenta;
        }

        .container > div:nth-child(6) {
            background-color: magenta;
        }

        .box {
            text-align: center;
        }

        @media (max-width: 900px) {

            .container {

                height: 90vh;

                grid-template-columns: repeat(2, 1fr);

                grid-template-areas:
                    "box1 box1"
                    "box2 box3"
                    "box2 box4"
                    "box2 box5"
                    "box6 box6";
            }
        }
        @media (max-width: 600px) {

            .container {

                height: auto;

                grid-template-columns: 1fr;

                grid-template-areas:
                    "box1"
                    "box2"
                    "box3"
                    "box4"
                    "box5"
                    "box6";
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div style="grid-area: box1" class="box">Header </div>
        <div style="grid-area: box2" class="box"> Sidebar</div>
        <div style="grid-area: box3" class="box"> Content</div>
        <div style="grid-area: box4" class="box">Card 1</div>
        <div style="grid-area: box5" class="box">Card 2 </div>
        <div style="grid-area: box6" class="box"> Footer</div>

    </div>

</body>
</html>
