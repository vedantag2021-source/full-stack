<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            flex-direction:row;
            outline:3px solid black;
            height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }
        .container>div{
            color:white;
            width:150px;
            height:100px;
        }
        .box1{
            background-color:black;
        }
        .box2{
            background-color:blue;
        }
        .box3{
            background-color:green;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
    
</body>
</html>
